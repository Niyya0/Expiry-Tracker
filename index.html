<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Expiry Checker</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#222}
main{max-width:700px;margin:0 auto;padding:16px}
h1{font-size:1.4rem}
.drop{display:block;background:#fff;border:2px dashed #bbb;border-radius:10px;padding:26px;text-align:center;cursor:pointer}
button,input[type=date]{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid #ccc}
button{background:#0f766e;color:#fff;border:0;cursor:pointer}
#msg{margin:10px 0;min-height:1.2em}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
#grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;border:4px solid #bbb}
#grid img.red{border-color:#b42318}#grid img.amber{border-color:#d97706}#grid img.green{border-color:#16a34a}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;max-width:340px;width:100%;text-align:center}
.card img{width:100%;max-height:260px;object-fit:contain;border-radius:8px}
.big{font-size:1.5rem;font-weight:bold;margin:10px 0 4px}
.red{color:#b42318}.amber{color:#d97706}.green{color:#16a34a}
.del{background:#b42318;margin-left:6px}
</style>
</head>
<body>
<main>
  <h1>Product Expiry Checker</h1>
  <label class="drop">
    <input id="photo" type="file" accept="image/*" multiple hidden>
    <b>Tap to upload product photos</b><br>The expiry date is read from the photo
  </label>
  <div id="msg"></div>
  <div id="grid"></div>
</main>

<div id="pop"><div class="card">
  <img id="pimg" alt="">
  <div class="big" id="prem"></div>
  <div id="pdate"></div>
  <div id="fix" style="display:none;margin-top:8px">
    <input type="date" id="fixdate"> <button id="fixbtn">Set</button>
  </div><br>
  <button id="close">Close</button><button class="del" id="del">Delete</button>
</div></div>

<script>
let items = [], current = -1;
const $ = id => document.getElementById(id);
try { items = JSON.parse(localStorage.getItem('items3') || '[]'); } catch (e) {}
function save() { try { localStorage.setItem('items3', JSON.stringify(items)); } catch (e) {} render(); }

/* ---------- date reading from OCR text ---------- */
const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
const pad = n => String(n).padStart(2, '0');
const yr = y => { y = +y; return y < 100 ? 2000 + y : y; };
function lastDay(y, m) { return new Date(y, m, 0).getDate(); }

function findDates(text) {
  let t = text.replace(/[Oo](?=\d)|(?<=\d)[Oo]/g, '0').replace(/[|Il](?=\d{2})/g, '1');
  let out = []; let m;
  const add = (y, mo, d) => { y = yr(y); if (mo >= 1 && mo <= 12 && y >= 2020 && y <= 2050) { d = d || lastDay(y, mo); if (d >= 1 && d <= 31) out.push(y + '-' + pad(mo) + '-' + pad(d)); } };
  let r = /(?<!\d)(\d{1,2})\s*[\/\-\. ]\s*(\d{1,2})\s*[\/\-\. ]\s*(\d{4}|\d{2})\b/g;
  while ((m = r.exec(t))) { let a = +m[1], b = +m[2]; if (b > 12 && a <= 12) [a, b] = [b, a]; add(m[3], b, a); }
  t = t.replace(r, ' ');
  r = /\b(\d{4})\s*[\/\-\.]\s*(\d{1,2})(?:\s*[\/\-\.]\s*(\d{1,2}))?\b/g;
  while ((m = r.exec(t))) add(m[1], +m[2], m[3] ? +m[3] : 0);
  t = t.replace(r, ' ');
  r = /\b(\d{1,2})?\s*[\/\-\. ]?\s*(jan|feb|mar|apr|may|jun|jul|aug|sept|sep|oct|nov|dec)[a-z]*[\s\/\-\.,']*(\d{4}|\d{2})\b/gi;
  while ((m = r.exec(t))) add(m[3], MON[m[2].toLowerCase()], m[1] ? +m[1] : 0);
  t = t.replace(r, ' ');
  r = /\b(\d{1,2})\s*[\/\-\.]\s*(\d{4})\b/g;
  while ((m = r.exec(t))) add(m[2], +m[1], 0);
  r = /(?<!\d)(\d{1,2})\s*[\/\-]\s*(\d{2})(?!\d)/g;
  while ((m = r.exec(t))) add(m[2], +m[1], 0);
  return out;
}
function pickExpiry(text) {
  // 1) dates on/after an EXP-type keyword
  const lines = text.split('\n');
  for (let i = 0; i < lines.length; i++) {
    if (/exp|use\s*by|best\s*before|\bbb\b|\bbbe\b/i.test(lines[i])) {
      const d = findDates(lines[i] + ' ' + (lines[i + 1] || ''));
      if (d.length) return d.sort().pop();
    }
  }
  // 2) otherwise the latest date found (expiry is after manufacture)
  const all = findDates(text);
  return all.length ? all.sort().pop() : '';
}

/* ---------- remaining time ---------- */
function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function fmt(later, earlier) {
  let months = (later.getFullYear() - earlier.getFullYear()) * 12 + later.getMonth() - earlier.getMonth();
  let tmp = new Date(earlier.getFullYear(), earlier.getMonth() + months, earlier.getDate());
  if (tmp > later) { months--; tmp = new Date(earlier.getFullYear(), earlier.getMonth() + months, earlier.getDate()); }
  const days = Math.round((later - tmp) / 86400000), p = [];
  if (months) p.push(months + (months === 1 ? ' month' : ' months'));
  if (days || !months) p.push(days + (days === 1 ? ' day' : ' days'));
  return p.join(' ');
}
function remaining(iso) {
  const [y, m, d] = iso.split('-').map(Number), t = today(), e = new Date(y, m - 1, d);
  const total = Math.round((e - t) / 86400000);
  if (total < 0) return { total, text: 'Expired ' + fmt(t, e) + ' ago' };
  return { total, text: total === 0 ? 'Expires today' : fmt(e, t) + ' left' };
}
function level(it) { if (!it.date) return ''; const n = remaining(it.date).total; return n < 0 ? 'red' : n <= 90 ? 'amber' : 'green'; }

/* ---------- photos ---------- */
function thumb(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => res('');
    img.src = URL.createObjectURL(file);
  });
}

$('photo').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (let i = 0; i < files.length; i++) {
    $('msg').textContent = 'Reading photo ' + (i + 1) + ' of ' + files.length + '... (first time may take a little while)';
    const photo = await thumb(files[i]);
    let date = '';
    try {
      const r = await Tesseract.recognize(files[i], 'eng');
      date = pickExpiry(r.data.text);
    } catch (err) {
      $('msg').textContent = 'Could not load the reader. Check your internet connection.';
    }
    items.push({ date, photo }); save();
  }
  if ($('msg').textContent.startsWith('Reading')) $('msg').textContent = 'Done. Click a photo to see the remaining time.';
};

function render() {
  const g = $('grid'); g.innerHTML = '';
  items.forEach((it, i) => {
    const im = document.createElement('img');
    im.src = it.photo; im.className = level(it); im.onclick = () => show(i);
    g.appendChild(im);
  });
}
function show(i) {
  current = i; const it = items[i];
  $('pimg').src = it.photo;
  if (it.date) {
    $('prem').className = 'big ' + level(it); $('prem').textContent = remaining(it.date).text;
    $('pdate').textContent = 'Expiry date: ' + it.date; $('fix').style.display = 'none';
  } else {
    $('prem').className = 'big'; $('prem').textContent = 'Date not found';
    $('pdate').textContent = 'Try a clearer photo, or set the date here:'; $('fix').style.display = 'block';
  }
  $('pop').style.display = 'flex';
}
$('fixbtn').onclick = () => { if ($('fixdate').value) { items[current].date = $('fixdate').value; save(); show(current); } };
$('close').onclick = () => $('pop').style.display = 'none';
$('del').onclick = () => { items.splice(current, 1); $('pop').style.display = 'none'; save(); };
$('pop').onclick = e => { if (e.target.id === 'pop') $('pop').style.display = 'none'; };
render();
</script>
</body>
</html>
