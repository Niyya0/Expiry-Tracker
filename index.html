<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Expiry Checker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--text:#222;--line:#ccc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1418;--card:#182028;--text:#e6ebf0;--line:#3a4653}}
:root[data-theme="dark"]{--bg:#0f1418;--card:#182028;--text:#e6ebf0;--line:#3a4653}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
main{max-width:700px;margin:0 auto;padding:16px}
h1{font-size:1.4rem}
.drop{display:block;background:var(--card);border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;cursor:pointer}
button{font:inherit;padding:8px 14px;border:0;border-radius:6px;background:#0f766e;color:#fff;cursor:pointer}
#msg{margin:10px 0;min-height:1.2em}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
#grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;border:4px solid var(--line)}
#grid img.red{border-color:#b42318}#grid img.amber{border-color:#d97706}#grid img.green{border-color:#16a34a}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border-radius:12px;padding:16px;max-width:340px;width:100%;text-align:center}
.card img{width:100%;max-height:260px;object-fit:contain;border-radius:8px}
.big{font-size:1.5rem;font-weight:bold;margin:10px 0 4px}
.red{color:#b42318}.amber{color:#d97706}.green{color:#16a34a}
.del{background:#b42318;margin-left:6px}
</style>
</head>
<body>
<main>
  <h1>Product Expiry Checker</h1>
  <label class="drop">
    <input id="photo" type="file" accept="image/*" multiple hidden>
    <b>Tap to upload product photos</b><br>The expiry date is read automatically
  </label>
  <div id="msg"></div>
  <div id="grid"></div>
</main>

<div id="pop"><div class="card">
  <img id="pimg" alt="">
  <div id="pname"></div>
  <div class="big" id="prem"></div>
  <div id="pdate"></div><br>
  <button id="close">Close</button><button class="del" id="del">Delete</button>
</div></div>

<script>
let items = [], current = -1, sample = null;
const $ = id => document.getElementById(id);
try { items = JSON.parse(localStorage.getItem('items2') || '[]'); } catch (e) {}
function save() { try { localStorage.setItem('items2', JSON.stringify(items)); } catch (e) {} render(); }

(async () => {
  try { sample = window.claude ? await claude.use('sample') : null; } catch (e) {}
  if (!sample) $('msg').textContent = 'Automatic reading works only when this page is opened inside Claude.';
})();

function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function remaining(iso) {
  const [y, m, d] = iso.split('-').map(Number), t = today(), e = new Date(y, m - 1, d);
  const total = Math.round((e - t) / 86400000);
  if (total < 0) return { total, text: 'Expired ' + fmt(t, e) + ' ago' };
  return { total, text: total === 0 ? 'Expires today' : fmt(e, t) + ' left' };
}
function fmt(later, earlier) {
  let months = (later.getFullYear() - earlier.getFullYear()) * 12 + later.getMonth() - earlier.getMonth();
  let tmp = new Date(earlier.getFullYear(), earlier.getMonth() + months, earlier.getDate());
  if (tmp > later) { months--; tmp = new Date(earlier.getFullYear(), earlier.getMonth() + months, earlier.getDate()); }
  const days = Math.round((later - tmp) / 86400000);
  const parts = [];
  if (months) parts.push(months + (months === 1 ? ' month' : ' months'));
  if (days || !months) parts.push(days + (days === 1 ? ' day' : ' days'));
  return parts.join(' ');
}
function level(it) {
  if (!it.date) return '';
  const n = remaining(it.date).total; return n < 0 ? 'red' : n <= 90 ? 'amber' : 'green';
}

function shrink(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 500 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res({ blob: b, url: c.toDataURL('image/jpeg', 0.7) }), 'image/jpeg', 0.85);
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(file);
  });
}

async function readDate(blob) {
  const prompt = `This is a photo of a medical product package. Find the product name and the EXPIRY date (EXP, Expiry, Use by, or hourglass symbol). Ignore manufacturing (MFG) dates.
Return ONLY JSON: {"name": string, "expiry": "YYYY-MM-DD" or null}.
If only month and year are shown, use the last day of that month. If no expiry date is readable, use null.`;
  return sample.json(prompt, { images: [blob], modelTier: 'default' });
}

$('photo').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!sample) { $('msg').textContent = 'Automatic reading works only when this page is opened inside Claude.'; return; }
  for (let i = 0; i < files.length; i++) {
    $('msg').textContent = 'Reading photo ' + (i + 1) + ' of ' + files.length + '...';
    const s = await shrink(files[i]); if (!s) continue;
    let name = '', date = '';
    try {
      const r = await readDate(s.blob);
      name = r.name || '';
      date = /^\d{4}-\d{2}-\d{2}$/.test(r.expiry || '') ? r.expiry : '';
    } catch (err) {
      if (err && err.code === 'not_granted') { $('msg').textContent = 'Permission declined.'; return; }
    }
    items.push({ name, date, photo: s.url }); save();
  }
  $('msg').textContent = 'Done. Click a photo to see the remaining time.';
};

function render() {
  const g = $('grid'); g.innerHTML = '';
  items.forEach((it, i) => {
    const im = document.createElement('img');
    im.src = it.photo; im.className = level(it); im.onclick = () => show(i);
    g.appendChild(im);
  });
}
function show(i) {
  current = i; const it = items[i];
  $('pimg').src = it.photo; $('pname').textContent = it.name;
  if (it.date) {
    const r = remaining(it.date);
    $('prem').className = 'big ' + level(it); $('prem').textContent = r.text;
    $('pdate').textContent = 'Expiry date: ' + it.date;
  } else {
    $('prem').className = 'big'; $('prem').textContent = 'Expiry date not found';
    $('pdate').textContent = 'Try a clearer photo of the date.';
  }
  $('pop').style.display = 'flex';
}
$('close').onclick = () => $('pop').style.display = 'none';
$('del').onclick = () => { items.splice(current, 1); $('pop').style.display = 'none'; save(); };
$('pop').onclick = e => { if (e.target.id === 'pop') $('pop').style.display = 'none'; };
render();
</script>
</body>
</html>
