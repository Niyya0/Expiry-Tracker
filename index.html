<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expiry Checker</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial;background:#f4f6f8;margin:0;padding:16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.c{background:#fff;border-radius:10px;padding:8px;text-align:center}
.c img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.red{color:#b42318}.amber{color:#d97706}.green{color:#16a34a}
</style>
</head>
<body>
<h2>Expiry Checker</h2>
<input type="file" id="f" accept="image/*" multiple>
<p id="msg"></p>
<div id="grid"></div>

<script>
const M = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};

// find the expiry date in the text read from the photo
function findDate(text) {
  const found = [];
  const add = (y, m, d) => {
    y = +y < 100 ? 2000 + +y : +y;
    if (m < 1 || m > 12 || y < 2020 || y > 2050) return;
    d = d || new Date(y, m, 0).getDate();          // month/year only -> last day of month
    found.push(y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'));
  };
  let t = text.replace(/\n/g, ' '), m;
  const use = (re, fn) => { while ((m = re.exec(t))) fn(m); t = t.replace(re, ' '); };
  use(/(?<!\d)(\d{4})[\/\-.](\d{1,2})(?:[\/\-.](\d{1,2}))?(?!\d)/g, m => add(m[1], +m[2], +m[3]));
  use(/(?<!\d)(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{4}|\d{2})(?!\d)/g, m => add(m[3], +m[2], +m[1]));
  use(/(?<!\d)(\d{1,2})?\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s\/\-.,]*(\d{4}|\d{2})(?!\d)/gi, m => add(m[3], M[m[2].toLowerCase()], +m[1]));
  use(/(?<!\d)(\d{1,2})[\/\-](\d{4}|\d{2})(?!\d)/g, m => add(m[2], +m[1], 0));
  return found.sort().pop() || '';                   // latest date = expiry
}

// time left, in months and days
function left(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const now = new Date(), a = new Date(now.getFullYear(), now.getMonth(), now.getDate()), b = new Date(y, m - 1, d);
  const expired = b < a, [s, e] = expired ? [b, a] : [a, b];
  let mo = (e.getFullYear() - s.getFullYear()) * 12 + e.getMonth() - s.getMonth();
  let x = new Date(s.getFullYear(), s.getMonth() + mo, s.getDate());
  if (x > e) { mo--; x = new Date(s.getFullYear(), s.getMonth() + mo, s.getDate()); }
  const days = Math.round((e - x) / 86400000);
  const text = (mo ? mo + ' month' + (mo > 1 ? 's ' : ' ') : '') + days + ' day' + (days === 1 ? '' : 's');
  return { text: expired ? 'Expired ' + text + ' ago' : text + ' left', color: expired ? 'red' : (e - s) / 86400000 <= 90 ? 'amber' : 'green' };
}

document.getElementById('f').onchange = async e => {
  for (const file of e.target.files) {
    document.getElementById('msg').textContent = 'Reading ' + file.name + '... please wait';
    const url = URL.createObjectURL(file);
    let date = '';
    try { date = findDate((await Tesseract.recognize(url, 'eng')).data.text); } catch (err) {}
    const r = date ? left(date) : { text: 'Date not found', color: '' };
    document.getElementById('grid').insertAdjacentHTML('beforeend',
      '<div class="c"><img src="' + url + '"><b class="' + r.color + '">' + r.text + '</b><br><small>' + date + '</small></div>');
  }
  document.getElementById('msg').textContent = '';
};
</script>
</body>
</html>
