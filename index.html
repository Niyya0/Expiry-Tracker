<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Expiry Checker</title>
<style>
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#222}
main{max-width:700px;margin:0 auto;padding:16px}
h1{font-size:1.4rem}
.box{background:#fff;padding:14px;border-radius:10px;display:grid;gap:10px;margin-bottom:16px}
input,button{font:inherit;padding:8px;border:1px solid #ccc;border-radius:6px}
button{background:#0f766e;color:#fff;border:0;cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
#grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;border:3px solid #ccc}
#grid img.red{border-color:#b42318}
#grid img.amber{border-color:#d97706}
#grid img.green{border-color:#16a34a}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
#pop .card{background:#fff;border-radius:12px;padding:16px;max-width:340px;width:100%;text-align:center}
#pop img{width:100%;max-height:260px;object-fit:contain;border-radius:8px}
#pop .days{font-size:1.6rem;font-weight:bold;margin:10px 0 4px}
#pop .red{color:#b42318}#pop .amber{color:#b45309}#pop .green{color:#166534}
#pop .del{background:#b42318;margin-left:6px}
</style>
</head>
<body>
<main>
  <h1>Product Expiry Checker</h1>
  <div class="box">
    <input id="name" type="text" placeholder="Product name (optional)">
    <label>Expiry date <input id="date" type="date"></label>
    <label>Photo <input id="photo" type="file" accept="image/*"></label>
    <button id="add">Add product</button>
  </div>
  <p>Click a photo to see how many days are left.</p>
  <div id="grid"></div>
</main>

<div id="pop"><div class="card">
  <img id="pimg" alt="">
  <div id="pname"></div>
  <div class="days" id="pdays"></div>
  <div id="pdate"></div><br>
  <button id="close">Close</button><button class="del" id="del">Delete</button>
</div></div>

<script>
let items = JSON.parse(localStorage.getItem('items') || '[]');
let current = -1;
const $ = id => document.getElementById(id);

function daysLeft(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(y, m - 1, d) - today) / 86400000);
}
function level(n) { return n < 0 ? 'red' : n <= 90 ? 'amber' : 'green'; }

function shrink(file, cb) {
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 500 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = img.width * s; c.height = img.height * s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', 0.7));
  };
  img.src = URL.createObjectURL(file);
}

function render() {
  const g = $('grid'); g.innerHTML = '';
  items.forEach((it, i) => {
    const im = document.createElement('img');
    im.src = it.photo; im.className = level(daysLeft(it.date));
    im.onclick = () => show(i);
    g.appendChild(im);
  });
}

function show(i) {
  current = i;
  const it = items[i], n = daysLeft(it.date);
  $('pimg').src = it.photo;
  $('pname').textContent = it.name;
  $('pdays').className = 'days ' + level(n);
  $('pdays').textContent = n < 0 ? 'Expired ' + (-n) + ' days ago' : n + ' days left';
  $('pdate').textContent = 'Expiry date: ' + it.date;
  $('pop').style.display = 'flex';
}

function save() { localStorage.setItem('items', JSON.stringify(items)); render(); }

$('add').onclick = () => {
  const file = $('photo').files[0], date = $('date').value;
  if (!file || !date) { alert('Choose a photo and an expiry date'); return; }
  const name = $('name').value.trim();
  shrink(file, photo => {
    items.push({ name, date, photo });
    $('name').value = ''; $('date').value = ''; $('photo').value = '';
    save();
  });
};
$('close').onclick = () => $('pop').style.display = 'none';
$('del').onclick = () => { items.splice(current, 1); $('pop').style.display = 'none'; save(); };
$('pop').onclick = e => { if (e.target.id === 'pop') $('pop').style.display = 'none'; };
render();
</script>
</body>
</html>
