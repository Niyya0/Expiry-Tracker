<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Expiry Checker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#222}
main{max-width:700px;margin:0 auto;padding:16px}
h1{font-size:1.4rem}
.drop{display:block;background:#fff;border:2px dashed #bbb;border-radius:10px;padding:26px;text-align:center;cursor:pointer}
button,input[type=date]{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid #ccc}
button{background:#0f766e;color:#fff;border:0;cursor:pointer}
#msg{margin:10px 0;min-height:1.2em}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
#grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}
.cell{background:#fff;border-radius:10px;padding:8px;text-align:center}
.cell .t{font-weight:bold;margin-top:6px;font-size:.95rem}
.cell .d{font-size:.8rem;color:#666}
#grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;border:4px solid #bbb}
#grid img.red{border-color:#b42318}#grid img.amber{border-color:#d97706}#grid img.green{border-color:#16a34a}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;max-width:340px;width:100%;text-align:center}
.card img{width:100%;max-height:260px;object-fit:contain;border-radius:8px}
.big{font-size:1.5rem;font-weight:bold;margin:10px 0 4px}
.red{color:#b42318}.amber{color:#d97706}.green{color:#16a34a}
.del{background:#b42318;margin-left:6px}
</style>
</head>
<body>
<main>
  <h1>Product Expiry Checker</h1>
  <input id="key" type="password" placeholder="Paste your Anthropic API key (saved on this device only)" style="width:100%;padding:8px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px">
  <label class="drop">
    <input id="photo" type="file" accept="image/*" multiple hidden>
    <b>Tap to upload product photos</b><br>Claude reads the expiry date from the photo
  </label>
  <div id="msg"></div>
  <div id="grid"></div>
</main>

<div id="pop"><div class="card">
  <img id="pimg" alt="">
  <div class="big" id="prem"></div>
  <div id="pdate"></div>
  <br>
  <button id="close">Close</button><button class="del" id="del">Delete</button>
</div></div>

<script>
let items = [], current = -1;
const $ = id => document.getElementById(id);
try { items = JSON.parse(localStorage.getItem('items4') || '[]'); } catch (e) {}
function save() { try { localStorage.setItem('items4', JSON.stringify(items)); } catch (e) {} render(); }

/* ---------- remaining time ---------- */
function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function fmt(later, earlier) {
  let months = (later.getFullYear() - earlier.getFullYear()) * 12 + later.getMonth() - earlier.getMonth();
  let tmp = new Date(earlier.getFullYear(), earlier.getMonth() + months, earlier.getDate());
  if (tmp > later) { months--; tmp = new Date(earlier.getFullYear(), earlier.getMonth() + months, earlier.getDate()); }
  const days = Math.round((later - tmp) / 86400000), p = [];
  if (months) p.push(months + (months === 1 ? ' month' : ' months'));
  if (days || !months) p.push(days + (days === 1 ? ' day' : ' days'));
  return p.join(' ');
}
function remaining(iso) {
  const [y, m, d] = iso.split('-').map(Number), t = today(), e = new Date(y, m - 1, d);
  const total = Math.round((e - t) / 86400000);
  if (total < 0) return { total, text: 'Expired ' + fmt(t, e) + ' ago' };
  return { total, text: total === 0 ? 'Expires today' : fmt(e, t) + ' left' };
}
function level(it) { if (!it.date) return ''; const n = remaining(it.date).total; return n < 0 ? 'red' : n <= 90 ? 'amber' : 'green'; }

/* ---------- photos ---------- */
function thumb(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => res('');
    img.src = URL.createObjectURL(file);
  });
}

function toBase64(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(file);
  });
}

async function readExpiry(file) {
  const key = $('key').value.trim();
  const b64 = await toBase64(file); if (!b64) return '';
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-5',
      max_tokens: 200,
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
        { type: 'text', text: 'This is a photo of a medical product package. Find the EXPIRY date (EXP, Expiry, Use by, Best before, or the hourglass symbol). Ignore manufacturing (MFG) dates and batch numbers. Reply with ONLY JSON like {"expiry":"YYYY-MM-DD"}. If only month and year are printed, use the last day of that month. If there is no readable expiry date, reply {"expiry":null}. Do not guess.' }
      ] }]
    })
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error((e.error && e.error.message) || ('Error ' + r.status)); }
  const data = await r.json();
  const text = (data.content || []).map(c => c.text || '').join('');
  const m = text.match(/\d{4}-\d{2}-\d{2}/);
  return m ? m[0] : '';
}

$('key').value = localStorage.getItem('apikey') || '';
$('key').onchange = () => { try { localStorage.setItem('apikey', $('key').value.trim()); } catch (e) {} };

$('photo').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!$('key').value.trim()) { $('msg').textContent = 'Please paste your Anthropic API key first (top of the page).'; return; }
  for (let i = 0; i < files.length; i++) {
    $('msg').textContent = 'Reading photo ' + (i + 1) + ' of ' + files.length + '...';
    const photo = await thumb(files[i]);
    let date = '';
    try { date = await readExpiry(files[i]); }
    catch (err) { $('msg').textContent = 'Error: ' + err.message; console.error(err); return; }
    items.push({ date, photo }); save();
  }
  $('msg').textContent = 'Done. The remaining time is shown under each photo.';
};

function render() {
  const g = $('grid'); g.innerHTML = '';
  items.forEach((it, i) => {
    const cell = document.createElement('div'); cell.className = 'cell';
    const im = document.createElement('img');
    im.src = it.photo; im.className = level(it); im.onclick = () => show(i);
    const t = document.createElement('div'), d = document.createElement('div');
    t.className = 't ' + level(it); d.className = 'd';
    if (it.date) { t.textContent = remaining(it.date).text; d.textContent = 'Expiry: ' + it.date; }
    else { t.textContent = 'Date not found'; d.textContent = 'Try a closer photo'; }
    cell.append(im, t, d); g.appendChild(cell);
  });
}
function show(i) {
  current = i; const it = items[i];
  $('pimg').src = it.photo;
  if (it.date) {
    $('prem').className = 'big ' + level(it); $('prem').textContent = remaining(it.date).text;
    $('pdate').textContent = 'Expiry date: ' + it.date;
  } else {
    $('prem').className = 'big'; $('prem').textContent = 'Date not found';
    $('pdate').textContent = 'Please upload a closer, sharper photo of the date.';
  }
  $('pop').style.display = 'flex';
}
$('close').onclick = () => $('pop').style.display = 'none';
$('del').onclick = () => { items.splice(current, 1); $('pop').style.display = 'none'; save(); };
$('pop').onclick = e => { if (e.target.id === 'pop') $('pop').style.display = 'none'; };
render();
</script>
</body>
</html>
